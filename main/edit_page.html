<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名片编辑</title>
<style>
  :root {
    --bg: #0B0F1A; --panel: #16213A; --accent: #14B8A6;
    --text: #E5E7EB; --muted: #94A3B8; --danger: #E11D48;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
         background: var(--bg); color: var(--text); padding: 16px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .card { background: var(--panel); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--accent); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], textarea {
    width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid #2A3A5A;
    background: #0B0F1A; color: var(--text); font-size: 14px; }
  textarea { resize: vertical; min-height: 64px; }
  button { background: var(--accent); color: #06251F; border: 0; border-radius: 8px;
           padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:active { opacity: 0.85; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .slot { border: 1px dashed #2A3A5A; border-radius: 10px; padding: 12px; text-align: center; }
  .slot.done { border-color: var(--accent); border-style: solid; }
  .slot .t { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .slot input[type=file] { font-size: 12px; color: var(--muted); width: 100%; }
  #status { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px;
            background: var(--accent); color: #06251F; font-size: 14px; font-weight: 600;
            transform: translateY(100%); transition: transform .2s; }
  #status.show { transform: translateY(0); }
  #status.err { background: var(--danger); color: #fff; }
</style>
</head>
<body>
  <h1>AI Passport 名片编辑</h1>
  <p class="sub">修改名片文字并上传头像与 7 张展示图。所有内容保存在设备上,掉电不丢。</p>

  <div class="card">
    <h2>名片文字</h2>
    <label>姓名</label>
    <input type="text" id="name" maxlength="15" placeholder="你的名字">
    <label>单位</label>
    <input type="text" id="unit" maxlength="15" placeholder="例如:合肥工业大学">
    <label>职务</label>
    <input type="text" id="position" maxlength="15" placeholder="例如:嵌入式工程师">
    <label>个性签名</label>
    <textarea id="signature" maxlength="64" placeholder="一句话介绍自己"></textarea>
    <div style="margin-top:12px"><button onclick="saveCard()">保存文字</button></div>
  </div>

  <div class="card">
    <h2>头像 (96 × 96)</h2>
    <div class="slot" id="slot-avatar"><div class="t">头像</div><input type="file" accept="image/*" onchange="uploadSlot(0, this, 96, 96)"></div>
  </div>

  <div class="card">
    <h2>展示图像 (240 × 320)</h2>
    <div class="grid" id="images"></div>
  </div>

  <div id="status"></div>

<script>
"use strict";

const PAGE_COUNT = 7, PAGE_W = 240, PAGE_H = 320;

function status(msg, err) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.classList.toggle('err', !!err);
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

function fileToRGB565(file, w, h) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const data = ctx.getImageData(0, 0, w, h).data;
      const bytes = new Uint8Array(w * h * 2);
      let o = 0;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        const px = ((r >> 3) << 11) | ((g >> 2) << 5) | (b >> 3);
        bytes[o++] = px & 0xFF;          // 小端,与设备 RGB565 一致
        bytes[o++] = (px >> 8) & 0xFF;
      }
      resolve(bytes);
    };
    img.onerror = () => reject(new Error('图片读取失败'));
    img.src = URL.createObjectURL(file);
  });
}

async function uploadSlot(slot, input, w, h) {
  const f = input.files && input.files[0];
  if (!f) return;
  const url = slot === 0 ? '/api/avatar' : '/api/image/' + slot;
  status('上传中…');
  try {
    const bytes = await fileToRGB565(f, w, h);
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: bytes
    });
    if (resp.ok) {
      markSlot(slot, true);
      status((slot === 0 ? '头像' : '第 ' + slot + ' 页') + ' 上传成功');
    } else {
      throw new Error('HTTP ' + resp.status);
    }
  } catch (e) {
    status('上传失败: ' + e.message, true);
  }
}

async function saveCard() {
  status('保存中…');
  const body = JSON.stringify({
    name: document.getElementById('name').value,
    unit: document.getElementById('unit').value,
    position: document.getElementById('position').value,
    signature: document.getElementById('signature').value
  });
  try {
    const resp = await fetch('/api/card', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body
    });
    if (resp.ok) status('名片文字已保存');
    else throw new Error('HTTP ' + resp.status);
  } catch (e) {
    status('保存失败: ' + e.message, true);
  }
}

function markSlot(slot, present) {
  const id = slot === 0 ? 'slot-avatar' : 'slot-' + slot;
  const el = document.getElementById(id);
  if (el) el.classList.toggle('done', !!present);
}

function buildImageSlots() {
  const grid = document.getElementById('images');
  for (let n = 1; n <= PAGE_COUNT; n++) {
    const div = document.createElement('div');
    div.className = 'slot';
    div.id = 'slot-' + n;
    div.innerHTML = '<div class="t">第 ' + n + ' 页</div>' +
      '<input type="file" accept="image/*" ' +
      'onchange="uploadSlot(' + n + ', this, ' + PAGE_W + ', ' + PAGE_H + ')">';
    grid.appendChild(div);
  }
}

async function loadState() {
  try {
    const resp = await fetch('/api/state');
    const st = await resp.json();
    document.getElementById('name').value = st.name || '';
    document.getElementById('unit').value = st.unit || '';
    document.getElementById('position').value = st.position || '';
    document.getElementById('signature').value = st.signature || '';
    const present = st.image_present || 0;
    markSlot(0, present & 1);
    for (let n = 1; n <= PAGE_COUNT; n++) markSlot(n, present & (1 << n));
  } catch (e) {
    status('读取设备状态失败: ' + e.message, true);
  }
}

buildImageSlots();
loadState();
</script>
</body>
</html>
